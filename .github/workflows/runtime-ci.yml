name: Modern runtime CI

on:
  push:
    branches: [modern-runtime]
  pull_request:
    branches: [main]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q tools Prima_training_and_evaluation end-to-end_inference_pipeline

      - name: Run focused runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_volutils_vectorized.py tests/test_attention_sdpa.py
