name: Modern runtime CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime-2026-09.lock.txt
          pip install "pytest==8.4.2"

      - name: Verify deployment lock snapshot
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "torch": "2.14.0",
              "monai": "1.6.0",
              "numpy": "2.4.6",
              "scipy": "1.17.1",
              "SimpleITK": "2.5.6",
              "pydicom": "3.0.2",
              "transformers": "4.49.0",
          }
          for package, wanted in expected.items():
              got = version(package)
              assert got == wanted, f"{package}: expected {wanted}, got {got}"
          PY

      - name: Compile Python sources
        run: |
          python -m compileall -q tools Prima_training_and_evaluation end-to-end_inference_pipeline

      - name: Run focused runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_volutils_vectorized.py tests/test_attention_sdpa.py tests/test_otsu_grid.py tests/test_vqvae_monai_core.py tests/test_patchifier_positional.py tests/test_head_runtime.py tests/test_otsu_pre_vq.py tests/test_checkpoint_loader.py tests/test_privacy_paths.py tests/test_stage_dicom_study.py tests/test_text_encoding.py tests/test_series_failfast.py tests/test_compare_predictions.py tests/test_render_report.py


  quant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install TorchAO test environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quant.txt
          pip install "pytest>=8.3,<9"

      - name: Smoke-test TorchAO 0.18 CPU INT8
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_torchao_quant.py
